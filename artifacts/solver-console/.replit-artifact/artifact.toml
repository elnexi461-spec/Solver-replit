kind = "web"
previewPath = "/console/"
title = "Solver API"
description = "A minimal service-status and integration guide for a private Bearer-authenticated API backed by the original self-hosted CAPTCHA solver. No credentials or solver results are handled by this page."
version = "1.0.0"
id = "artifacts/solver-console"
router = "path"

[[services]]
name = "web"
paths = [ "/console/" ]
localPort = 20914

[services.development]
run = "pnpm --filter @workspace/solver-console run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solver-console", "run", "build" ]
serve = "static"
publicDir = "artifacts/solver-console/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20914"
BASE_PATH = "/console/"
